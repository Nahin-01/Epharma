version: "3.9"

services:
  backend:
    build: .
    image: epharmacy-backend:local
    container_name: epharmacy-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/epharmacy
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/usr/src/app/uploads

  worker:
    build: .
    image: epharmacy-backend:local
    container_name: epharmacy-worker
    restart: unless-stopped
    command: ["node", "src/jobs/worker.js"]
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/epharmacy
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/usr/src/app/uploads

  mongo:
    image: mongo:7
    container_name: epharmacy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: epharmacy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  uploads:
