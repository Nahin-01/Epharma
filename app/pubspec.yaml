name: epharmacy_app
description: "ePharmacy — order medicine online, tracked delivery, licensed pharmacist review."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3+1
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI / UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  url_launcher: ^6.2.6
  flutter_svg: ^2.0.10+1
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
